<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1e1e2e" id="themeMetaColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<title>Pabliki Growth — Roadmap</title>
<script src="pabliki-data.js?v=19"></script>
<script src="leads-data.js?v=19"></script>
<!-- leads-2gis.js загружается лениво при открытии вкладки Клиенты → База 2GIS -->
<script async src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ======================== CATPPUCCIN THEME ======================== */
:root{
  --radius:6px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

/* DARK — Catppuccin Mocha */
[data-theme="dark"]{
  --bg:oklch(0.2155 0.0254 284.0647);
  --bg2:oklch(0.2429 0.0304 283.9110);
  --surface:oklch(0.2973 0.0294 276.2144);
  --text:oklch(0.8787 0.0426 272.2767);
  --text2:oklch(0.7510 0.0396 273.9320);
  --text3:oklch(0.5500 0.0340 278);
  --border:oklch(0.3240 0.0319 281.9784);
  --primary:oklch(0.7400 0.1400 230);
  --primary-fg:oklch(0.2429 0.0304 283.9110);
  --accent:oklch(0.8467 0.0833 210.2545);
  --accent-fg:oklch(0.2429 0.0304 283.9110);
  --green:oklch(0.8577 0.1092 142.7153);
  --red:oklch(0.7556 0.1297 2.7642);
  --peach:oklch(0.8237 0.1015 52.6294);
  --yellow:oklch(0.8870 0.0979 84.3);
  --blue:oklch(0.7400 0.1200 240);
  --chart1:oklch(0.7400 0.1400 230);
  --chart2:oklch(0.8467 0.0833 210.2545);
  --chart3:oklch(0.8577 0.1092 142.7153);
  --chart4:oklch(0.8237 0.1015 52.6294);
  --shadow:0px 4px 6px 0px hsl(240 30% 25% / 0.12);
  --card-bg:oklch(0.2429 0.0304 283.9110);
  --input-bg:oklch(0.2973 0.0294 276.2144);
}

/* LIGHT — Catppuccin Latte */
[data-theme="light"]{
  --bg:oklch(0.9578 0.0058 264.5321);
  --bg2:oklch(1.0000 0 0);
  --surface:oklch(0.9060 0.0117 264.5071);
  --text:oklch(0.4355 0.0430 279.3250);
  --text2:oklch(0.5471 0.0343 279.0837);
  --text3:oklch(0.7000 0.0200 270);
  --border:oklch(0.8083 0.0174 271.1982);
  --primary:oklch(0.5800 0.1800 235);
  --primary-fg:oklch(1.0000 0 0);
  --accent:oklch(0.6820 0.1448 235.3822);
  --accent-fg:oklch(1.0000 0 0);
  --green:oklch(0.6250 0.1772 140.4448);
  --red:oklch(0.5505 0.2155 19.8095);
  --peach:oklch(0.6920 0.2041 42.4293);
  --yellow:oklch(0.6800 0.1500 80);
  --blue:oklch(0.5800 0.1800 240);
  --chart1:oklch(0.5800 0.1800 235);
  --chart2:oklch(0.6820 0.1448 235.3822);
  --chart3:oklch(0.6250 0.1772 140.4448);
  --chart4:oklch(0.6920 0.2041 42.4293);
  --shadow:0px 4px 6px 0px hsl(240 30% 25% / 0.08);
  --card-bg:oklch(1.0000 0 0);
  --input-bg:oklch(0.9060 0.0117 264.5071);
}

/* ======================== BASE ======================== */
html{font-family:'Montserrat',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent;transition:background .3s,color .3s}
body{min-height:100vh;background:var(--bg);padding:0;overflow-x:hidden;padding-top:var(--safe-top);padding-bottom:calc(80px + var(--safe-bottom));transition:background .3s}

/* ======================== SPLASH ======================== */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s}
#splash h2{font-size:22px;font-weight:800;color:var(--primary);letter-spacing:2px}
#splash p{color:var(--text2);font-size:12px;margin-top:8px}

#app{max-width:480px;margin:0 auto;padding:24px 16px;transition:max-width .3s}

/* ======================== HEADER ======================== */
.header{text-align:center;padding:16px 0 20px}
.header h1{font-size:28px;font-weight:900;letter-spacing:2px;color:var(--primary)}
.header p{font-size:13px;color:var(--text2);margin-top:4px}

/* ======================== THEME TOGGLE ======================== */
.theme-toggle{position:fixed;top:calc(16px + var(--safe-top));right:16px;z-index:100;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--card-bg);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:all .3s;box-shadow:var(--shadow)}
.theme-toggle:active{transform:scale(0.9)}

/* ======================== PROGRESS ======================== */
.progress-section{margin-bottom:20px}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;color:var(--text2)}
.progress-header strong{font-size:22px;color:var(--primary);font-weight:800}
.progress-bar{height:6px;background:var(--surface);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:3px;transition:width .5s ease}

/* ======================== STATS ======================== */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat{text-align:center;padding:14px 8px;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius)}
.stat .num{font-size:24px;font-weight:800;line-height:1}
.stat .label{font-size:10px;color:var(--text2);margin-top:4px;text-transform:uppercase;letter-spacing:0.5px;font-weight:600}
.stat.green .num{color:var(--green)}
.stat.orange .num{color:var(--peach)}
.stat.blue .num{color:var(--accent)}

/* ======================== TABS ======================== */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:20px;scrollbar-width:none;-ms-overflow-style:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:var(--radius);font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;transition:all .2s;color:var(--text2);background:var(--card-bg);border:1px solid var(--border)}
.tab.active{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.tab:active{transform:scale(0.96)}

/* ======================== PHASE ======================== */
.phase{margin-bottom:16px}
.phase-header{display:flex;align-items:center;gap:12px;padding:16px;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .2s;box-shadow:var(--shadow)}
.phase-header:active{transform:scale(0.99)}
.phase-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.phase-info{flex:1;min-width:0}
.phase-info h3{font-size:14px;font-weight:800;letter-spacing:0.5px;color:var(--text)}
.phase-info .meta{font-size:11px;color:var(--text2);margin-top:2px}
.phase-progress{font-size:14px;font-weight:700;flex-shrink:0}
.phase-chevron{color:var(--text3);transition:transform .3s;flex-shrink:0}
.phase.open .phase-chevron{transform:rotate(180deg)}

.phase-body{background:var(--card-bg);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius);overflow:hidden;display:none;padding:8px 16px 16px}
.phase.open .phase-body{display:block}

/* ======================== TASK ======================== */
.task{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);transition:opacity .3s}
.task:last-of-type{border-bottom:none}
.task.done{opacity:0.5}
.task-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);flex-shrink:0;cursor:pointer;transition:all .2s;margin-top:2px;display:flex;align-items:center;justify-content:center}
.task-check:active{transform:scale(0.85)}
.task.done .task-check{background:var(--green);border-color:var(--green)}
.task.done .task-check::after{content:'✓';color:var(--bg);font-size:12px;font-weight:700}
.task-content{flex:1;min-width:0;cursor:pointer}
.task-title{font-size:14px;font-weight:600;line-height:1.4;color:var(--text)}
.task.done .task-title{text-decoration:line-through;color:var(--text2)}
.task-desc{font-size:12px;color:var(--text2);line-height:1.5;margin-top:4px}
.task-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px}
.tag.priority-high{background:oklch(from var(--red) l c h / 0.15);color:var(--red)}
.tag.priority-med{background:oklch(from var(--yellow) l c h / 0.15);color:var(--yellow)}
.tag.priority-low{background:oklch(from var(--blue) l c h / 0.15);color:var(--blue)}
.tag.type-seo{background:oklch(from var(--accent) l c h / 0.15);color:var(--accent)}
.tag.type-sales{background:oklch(from var(--green) l c h / 0.15);color:var(--green)}
.tag.type-product{background:oklch(from var(--peach) l c h / 0.15);color:var(--peach)}
.tag.type-marketing{background:oklch(from var(--primary) l c h / 0.15);color:var(--primary)}
.tag.type-team{background:oklch(from var(--chart4) l c h / 0.15);color:var(--chart4)}
.task-delete{color:var(--text3);font-size:14px;cursor:pointer;padding:4px;opacity:0.5;transition:all .2s;flex-shrink:0}
.task-delete:active{opacity:1;color:var(--red)}

/* ======================== HOWTO EXPAND ======================== */
.task-howto{display:none;margin-top:10px;padding:12px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);font-size:12.5px;color:var(--text2);line-height:1.7}
.task.expanded .task-howto{display:block;animation:fadeIn .3s ease}
.task-howto h5{color:var(--primary);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.task-howto p{margin-bottom:8px}
.task-howto ul{margin:6px 0 10px 16px}
.task-howto li{margin-bottom:4px}
.task-howto .step{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
.task-howto .step-num{width:22px;height:22px;border-radius:7px;background:oklch(from var(--primary) l c h / 0.15);color:var(--primary);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.task-howto .step-text{flex:1;color:var(--text)}
.task-howto .tip{margin-top:8px;padding:8px 10px;background:oklch(from var(--green) l c h / 0.1);border-radius:var(--radius);border-left:3px solid var(--green);font-size:11.5px;color:var(--green)}
.task-expand-btn{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:8px 14px;border:1px solid var(--accent);border-radius:var(--radius);background:transparent;color:var(--accent);font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
.task-expand-btn:active{transform:scale(0.97);background:var(--surface)}
.task.expanded .task-expand-btn{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.task-expand-btn .chevron{transition:transform .2s;display:inline-block}
.task.expanded .task-expand-btn .chevron{transform:rotate(180deg)}

/* ======================== VICTORIA BUTTONS ======================== */
.victoria-btn{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:8px 14px;border:none;border-radius:var(--radius);font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s;text-decoration:none;-webkit-tap-highlight-color:transparent}
.victoria-btn.can-do{background:oklch(from var(--primary) l c h / 0.15);color:var(--primary);border:1px solid oklch(from var(--primary) l c h / 0.25)}
.victoria-btn.can-do:active{transform:scale(0.97);background:oklch(from var(--primary) l c h / 0.25)}
.victoria-btn.guide{background:oklch(from var(--accent) l c h / 0.1);color:var(--accent);border:1px solid oklch(from var(--accent) l c h / 0.2)}
.victoria-btn.guide:active{transform:scale(0.97);background:oklch(from var(--accent) l c h / 0.2)}

/* ======================== ADD FORM ======================== */
.add-task-btn{width:100%;padding:12px;border:1px dashed var(--border);border-radius:var(--radius);background:transparent;color:var(--text2);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s;margin-top:8px}
.add-task-btn:active{background:var(--surface)}
.add-form{display:none;padding:12px 0}
.add-form.show{display:block}
.add-form input,.add-form textarea,.add-form select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--input-bg);color:var(--text);font-size:14px;font-family:inherit;margin-bottom:8px;transition:border-color .2s}
.add-form input:focus,.add-form textarea:focus,.add-form select:focus{outline:none;border-color:var(--primary)}
.add-form textarea{min-height:60px;resize:vertical}
.form-row{display:flex;gap:8px}
.form-row select{flex:1}

/* ======================== BUTTONS ======================== */
.btn{padding:10px 20px;border-radius:var(--radius);font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s;border:none}
.btn:active{transform:scale(0.97)}
.btn-primary{background:var(--primary);color:var(--primary-fg)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}

/* ======================== FINANCE ======================== */
.finance-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.finance-card h4{font-size:14px;font-weight:700;margin-bottom:14px;color:var(--text)}
.finance-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px}
.finance-row .label{color:var(--text2)}
.finance-row .value{font-weight:700;color:var(--text)}
.finance-row .value.green{color:var(--green)}
.finance-row .value.red{color:var(--red)}

/* ======================== NAV ======================== */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card-bg);border-top:1px solid var(--border);display:flex;justify-content:center;gap:0;padding:8px 0 calc(8px + var(--safe-bottom));z-index:50;transition:background .3s}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;cursor:pointer;transition:color .2s;color:var(--text3)}
.nav-item.active{color:var(--primary)}
.nav-item .icon{font-size:16px}
.nav-item .label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}

/* ======================== TOAST / MODAL ======================== */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card-bg);border:1px solid var(--border);color:var(--text);padding:12px 24px;border-radius:var(--radius);font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:200;pointer-events:none;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:360px;width:90%;box-shadow:var(--shadow)}

/* ======================== ANIMATIONS ======================== */
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ======================== SELECTION / ПОДБОРКА ======================== */
.filter-section{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.filter-section h4{font-size:13px;font-weight:700;margin-bottom:12px;color:var(--text)}
.filter-row{margin-bottom:12px}
.filter-label{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:6px;display:flex;justify-content:space-between}
.filter-label span{color:var(--primary);font-weight:700}
.city-chips{display:flex;flex-wrap:wrap;gap:6px}
.city-chip{padding:6px 10px;border-radius:var(--radius);font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2);font-family:inherit;transition:all .15s;-webkit-tap-highlight-color:transparent}
.city-chip.active{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.city-chip:active{transform:scale(0.95)}
input[type=range]{width:100%;height:4px;border-radius:2px;outline:none;-webkit-appearance:none;background:var(--surface);margin:8px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--primary);cursor:pointer;border:2px solid var(--card-bg)}
.mode-toggle{display:flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
.mode-btn{flex:1;padding:10px;font-size:12px;font-weight:700;text-align:center;cursor:pointer;border:none;background:transparent;color:var(--text2);font-family:inherit;transition:all .2s}
.mode-btn.active{background:var(--primary);color:var(--primary-fg)}
.sel-table{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:12px}
.sel-table th{text-align:left;padding:8px 6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;color:var(--primary);border-bottom:2px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--card-bg);z-index:2}
.sel-table td{padding:8px 6px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:middle}
.sel-table td:first-child{color:var(--text);font-weight:600}
.sel-table tr:last-child td{border-bottom:none}
.sel-table .num{text-align:right;font-variant-numeric:tabular-nums}
.sel-table .ig-link{color:var(--accent);text-decoration:none;font-weight:600}
.sel-table .ig-link:active{opacity:0.7}
.sel-check{width:18px;height:18px;border-radius:4px;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.sel-check.checked{background:var(--primary);border-color:var(--primary)}
.sel-check.checked::after{content:'✓';color:var(--primary-fg);font-size:11px;font-weight:700}
.sel-total{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.sel-total-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.sel-total-row .label{color:var(--text2)}
.sel-total-row .val{font-weight:700;color:var(--text)}
.sel-total-row .val.green{color:var(--green)}
.sel-actions{display:flex;gap:8px;margin-bottom:16px}
.sel-actions .btn{flex:1;font-size:12px;padding:12px}
.table-wrap{overflow-x:auto;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);max-height:50vh;overflow-y:auto}
.sel-count{font-size:12px;color:var(--text2);margin-bottom:8px;text-align:center}
.sel-count strong{color:var(--primary)}

/* ======================== LOGO ======================== */
.header-logo{height:40px;width:auto}
[data-theme="dark"] .logo-light{display:inline}
[data-theme="dark"] .logo-dark{display:none}
[data-theme="light"] .logo-light{display:none}
[data-theme="light"] .logo-dark{display:inline}

/* ======================== STICKY TOTALS ======================== */
.sel-sticky{background:var(--bg);padding:12px 0 4px}

/* ======================== SEARCH ======================== */
.ig-search{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--input-bg);color:var(--text);font-size:13px;font-family:inherit;margin-bottom:8px}
.ig-search:focus{outline:none;border-color:var(--primary)}

/* ======================== SORTABLE ======================== */
.sel-table th.sortable{cursor:pointer;user-select:none;transition:color .15s}
.sel-table th.sortable:hover{color:var(--accent)}
.sort-arrow{font-size:9px;margin-left:2px;opacity:0.5}
.sort-arrow.active{opacity:1}

/* ======================== BUDGET PRESETS ======================== */
.budget-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.budget-presets button{padding:5px 10px;border-radius:var(--radius);font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2);font-family:inherit;transition:all .15s}
.budget-presets button:active{transform:scale(0.95);background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}

/* Tag fallback for browsers without oklch relative */
@supports not (background: oklch(from red l c h / 0.5)) {
  .tag.priority-high{background:rgba(210,80,80,0.15);color:#d25050}
  .tag.priority-med{background:rgba(200,170,50,0.15);color:#c8aa32}

.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}

.lead-status[data-s="sent"]{background:rgba(245,158,11,0.15);color:#f59e0b}
.lead-status[data-s="dialog"]{background:rgba(139,92,246,0.15);color:#8b5cf6}

t2:`<h5>🔧 Как исправить</h5>
<div class="step"><div class="step-num">1</div><div class="step-text">Открыть файл <b>public/robots.txt</b> в проекте pabliki.kz</div></div>
<div class="step"><div class="step-num">2</div><div class="step-text">Заменить <b>your-production-domain.com</b> на <b>pabliki.kz</b></div></div>
<div class="step"><div class="step-num">3</div><div class="step-text">Должно быть: <code>Sitemap: https://pabliki.kz/sitemap.xml</code></div></div>
<div class="step"><div class="step-num">4</div><div class="step-text">Задеплоить изменение</div></div>
<div class="tip">💡 Без этого Google не находит карту сайта. Фикс за 2 минуты, эффект — огромный.</div>`,

t3:`<h5>🔧 Как исправить</h5>
<div class="step"><div class="step-num">1</div><div class="step-text">Найти главный заголовок на landing page (сейчас &lt;h2&gt;)</div></div>
<div class="step"><div class="step-num">2</div><div class="step-text">Заменить тег на &lt;h1&gt; — на странице должен быть ровно один &lt;h1&gt;</div></div>
<div class="step"><div class="step-num">3</div><div class="step-text">Проверить все остальные страницы — каждая должна иметь свой уникальный &lt;h1&gt;</div></div>
<div class="tip">💡 Google использует h1 как главный сигнал о содержании страницы. Без него SEO страдает.</div>`,

t4:`<h5>🔧 Как добавить</h5>
<div class="step"><div class="step-num">1</div><div class="step-text">В Next.js добавить в layout или metadata каждой страницы:</div></div>
<p><code>&lt;link rel="canonical" href="https://pabliki.kz/ru" /&gt;</code></p>
<div class="step"><div class="step-num">2</div><div class="step-text">Каждая языковая версия указывает canonical на себя</div></div>
<div class="step"><div class="step-num">3</div><div class="step-text">/ru, /en, /kk — каждая со своим canonical</div></div>
<div class="tip">💡 Без canonical Google может считать /ru и /en дублями и понижать обе страницы.</div>`,

t5:`<h5>🔧 Как добавить</h5>
<div class="step"><div class="step-num">1</div><div class="step-text">Добавить в &lt;head&gt; главной страницы скрипт JSON-LD:</div></div>
<p><b>Organization:</b> название, лого, контакты, соцсети</p>
<p><b>LocalBusiness:</b> адрес в КЗ, телефон, часы работы</p>
<p><b>FAQ:</b> популярные вопросы — «Сколько стоит реклама?», «Как разместиться?» и т.д.</p>
<div class="step"><div class="step-num">2</div><div class="step-text">Проверить через <b>search.google.com/test/rich-results</b></div></div>
<div class="tip">💡 FAQ schema может дать расширенные сниппеты в Google — больше места в выдаче бесплатно.</div>`,

t6:`<h5>🔧 Как сделать</h5>
<div class="step"><div class="step-num">1</div><div class="step-text">Главная: «Pabliki.kz — городская реклама в 700+ пабликах Казахстана. 14 регионов, 93М+ охвата.»</div></div>
<div class="step"><div class="step-num">2</div><div class="step-text">Контакты: «Связаться с Pabliki.kz — менеджер ответит за 5 минут. WhatsApp, телефон, email.»</div></div>
<div class="step"><div class="step-num">3</div><div class="step-text">Каждая статья в блоге — уникальный description по содержанию</div></div>
<div class="tip">💡 Description = рекламный текст в Google. 150-160 символов, с призывом к действию.</div>`,

t7:`<h5>🔧 Как исправить</h5>
<div class="step"><div class="step-num">1</div><div class="step-text">В Next.js middleware или конфиге: поменять все 307 (temporary) на 301 (permanent)</div></div>
<div class="step"><div class="step-num">2</div><div class="step-text">Проверить /ru/contacts → /contacts и аналогичные</div></div>
<div class="tip">💡 307 = Google не передаёт SEO-вес. 301 = передаёт полностью. Разница в позициях.</div>`,

t8:`<h5>🎯 План действий</h5>
<div class="step"><div class="step-num">1</div><div class="step-text">Составить список 20 узнаваемых брендов по нишам: 3 ресторана, 3 клиники, 3 автосалона, 3 фитнеса, 3 застройщика, 5 других</div></div>
<div class="step"><div class="step-num">2</div><div class="step-text">Написать каждому в WhatsApp/Instagram: «Бесплатное размещение во всех пабликах вашего города. Взамен — логотип в «Нам доверяют» + видео-отзыв 30 сек»</div></div>
<div class="step"><div class="step-num">3</div><div class="step-text">После размещения — собрать метрики (охват, клики, заявки)</div></div>
<div class="step"><div class="step-num">4</div><div class="step-text">Оформить кейс: Было → Стало → ROI. С цифрами и скриншотами.</div></div>
<div class="step"><div class="step-num">5</div><div class="step-text">Выложить на сайт + использовать в КП</div></div>
<div class="tip">💡 Бюджет ~2-3М₸ на себестоимость. Но 20 кейсов в 20 нишах = конверсия КП вырастет в 3 раза.</div>`,

t9:`<h5>⚡ Как сделать</h5>
<div class="step"><div class="step-num">1</div><div class="step-text">Страница на сайте: 3 поля — Город, Ниша, Бюджет</div></div>
<div class="step"><div class="step-num">2</div><div class="step-text">Алгоритм подбирает паблики из базы, считает охват и прогноз заявок</div></div>
<div class="step"><div class="step-num">3</div><div class="step-text">Результат: «15 пабликов, 2.5М подписчиков, ~500К просмотров за 3 дня»</div></div>
<div class="step"><div class="step-num">4</div><div class="step-text">Для получения PDF — ввести email (лидген!)</div></div>
<div class="step"><div class="step-num">5</div><div class="step-text">Добавить сравнение: «Это как 3 билборда на месяц, но в 5 раз дешевле»</div></div>
<div class="tip">💡 Калькулятор = и SEO-инструмент, и лидген, и конвертер. Клиент сам себе «продаёт».</div>`,

t10:`<h5>👥 Как нанять и запустить</h5>
<div class="step"><div class="step-num">1</div><div class="step-text">Профиль: опыт в B2B продажах, КЗ рынок, уверенный в холодных звонках. ЗП: 200-300К₸ фикс + % от закрытых сделок</div></div>
<div class="step"><div class="step-num">2</div><div class="step-text">Дать базу: спарсить все компании КЗ с Instagram 1000+ подписчиков</div></div>
<div class="step"><div class="step-num">3</div><div class="step-text">Скрипт: 1) Персональный разбор их рекламы → 2) Кейс из ниши → 3) Бесплатный медиаплан</div></div>
<div class="step"><div class="step-num">4</div><div class="step-text">KPI: 50 касаний/день, 10 квалифицированных лидов/неделя</div></div>
<div class="tip">💡 Не «купите размещение», а «мы подготовили для вас медиаплан — можем показать?»</div>`,

t11:`<h5>💰 Что сделать</h5>
<div class="step"><div class="step-num">1</div><div class="step-text">Обновлённая база уже готова — файл «база-пабликов-новые-цены.xlsx»</div></div>
<div class="step"><div class="step-num">2</div><div class="step-text">Загрузить новые цены в систему Pabliki.kz</div></div>
<div class="step"><div class="step-num">3</div><div class="step-text">Правила: крупные паблики (500К₸+) — наценка мин 80%, средние — 100%, мелкие — 150%</div></div>
<div class="step"><div class="step-num">4</div><div class="step-text">Минимальная цена = Себестоимость ÷ 0.55 (гарантирует 45% валовой маржи)</div></div>
<div class="tip">💡 Эффект: +4.8М₸/мес чистой прибыли при 100 заказах, без единого нового клиента.</div>`,

t12:`<h5>📋 Шаги</h5>
<div class="step"><div class="step-num">1</div><div class="step-text">Подать заявку через IP Guard (ipguard.kz) — свой проект</div></div>
<div class="step"><div class="step-num">2</div><div class="step-text">Класс 35 (реклама) и класс 42 (IT-сервисы)</div></div>
<div class="step"><div class="step-num">3</div><div class="step-text">Срок регистрации: 12-14 месяцев, но приоритет с даты подачи</div></div>
<div class="tip">💡 Защита от копирования бренда. Плюс: можно использовать значок ® в маркетинге — добавляет доверия.</div>`,

t13:`<h5>⚡ Как сделать</h5>
<div class="step"><div class="step-num">1</div><div class="step-text">Добавить на первый экран большую кнопку: <b>«Собрать подборку бесплатно →»</b></div></div>
<div class="step"><div class="step-num">2</div><div class="step-text">Кнопка ведёт на квиз vsepabliki.kz/kvizpbkz или на калькулятор</div></div>
<div class="step"><div class="step-num">3</div><div class="step-text">Цвет — контрастный (жёлтый/оранжевый на синем фоне)</div></div>
<div class="step"><div class="step-num">4</div><div class="step-text">Добавить подтекст: «Бесплатно • Без регистрации • За 30 секунд»</div></div>
<div class="tip">💡 Сейчас на hero нет CTA для новых клиентов — только «Личный кабинет» для существующих. Теряете конверсии.</div>`,

t14:`<h5>📊 Как добавить</h5>
<div class="step"><div class="step-num">1</div><div class="step-text">Блок под hero: три крупных числа в ряд</div></div>
<div class="step"><div class="step-num">2</div><div class="step-text"><b>700+</b> пабликов • <b>14</b> регионов • <b>93M+</b> просмотров</div></div>
<div class="step"><div class="step-num">3</div><div class="step-text">Анимация счётчика при скролле (countUp.js или CSS)</div></div>
<div class="tip">💡 Цифры = мгновенное доверие. Посетитель за 2 секунды понимает масштаб.</div>`,

t15:`<h5>💰 Структура пакетов</h5>
<p><b>🏙️ ГОРОД</b> — 1 город, 10-15 пабликов, пост+сторис, 1 волна → <b>300-500К₸</b></p>
<p><b>🌆 РЕГИОН</b> — 3-5 городов, 2 волны, аналитика → <b>800К-1.2М₸</b> (целевой пакет)</p>
<p><b>🇰🇿 КАЗАХСТАН</b> — все регионы, 4 волны, менеджер → <b>2-3М₸</b></p>
<p><b>Аддоны:</b> WhatsApp-рассылка +200К, повторная волна +30%, видеопродакшн +150К, срочное (24ч) +20%</p>
<div class="tip">💡 Якорь сверху (2.5М₸) делает средний пакет (1М₸) психологически «выгодным» — эффект приманки Ариели.</div>`,

t20:`<h5>📝 План статей</h5>
<ul>
<li>«Реклама в Алматы: цены, каналы, сравнение 2026»</li>
<li>«Как рекламировать ресторан в Астане — 5 рабочих каналов»</li>
<li>«Реклама в Instagram пабликах Казахстана — полный гайд»</li>
<li>«Продвижение бизнеса в Шымкенте — что работает»</li>
<li>«Альтернатива билбордам: городские паблики»</li>
<li>«Сколько стоит реклама в пабликах — калькулятор»</li>
<li>«ТОП-10 пабликов Алматы по охвату»</li>
<li>«Как выбрать паблик для рекламы — чеклист»</li>
<li>«Кейс: 300 заявок за неделю из пабликов»</li>
<li>«Таргет vs паблики: что эффективнее для локального бизнеса»</li>
</ul>
<div class="tip">💡 Каждая статья — 1500-2000 слов, с CTA на калькулятор/квиз. SEO-трафик начнёт расти через 2-3 месяца.</div>`,

t21:`<h5>🎬 Форматы видео</h5>
<div class="step"><div class="step-num">1</div><div class="step-text"><b>Сравнение:</b> «500К на билборд vs 500К на Pabliki — результат» (60 сек)</div></div>
<div class="step"><div class="step-num">2</div><div class="step-text"><b>Обзор:</b> «Сколько стоит реклама в каждом городе КЗ» (3-5 мин)</div></div>
<div class="step"><div class="step-num">3</div><div class="step-text"><b>Кейс:</b> «Как [бренд] получил 300 заявок за неделю» (2-3 мин)</div></div>
<div class="step"><div class="step-num">4</div><div class="step-text"><b>Behind the scenes:</b> «Как работает Pabliki изнутри» (1-2 мин, Reels)</div></div>
<div class="step"><div class="step-num">5</div><div class="step-text"><b>Отзывы:</b> клиенты на камеру (30 сек, вертикальный формат)</div></div>
<div class="tip">💡 Один формат → нарезать для YouTube (длинный), Instagram Reels (60 сек), TikTok (30 сек).</div>`,

t22:`<h5>🤝 Запуск партнёрки</h5>
<div class="step"><div class="step-num">1</div><div class="step-text">Составить список 50 маркетинговых агентств КЗ (Алматы, Астана, Шымкент)</div></div>
<div class="step"><div class="step-num">2</div><div class="step-text">Подготовить презентацию: 10-20% комиссия, white-label, готовые медиапланы</div></div>
<div class="step"><div class="step-num">3</div><div class="step-text">Провести 10 личных встреч / zoom-презентаций</div></div>
<div class="step"><div class="step-num">4</div><div class="step-text">Дать 5 лучшим агентствам пилотный бесплатный заказ для их клиента</div></div>
<div class="step"><div class="step-num">5</div><div class="step-text">Создать Telegram-чат «Pabliki Partners» для быстрой коммуникации</div></div>
<div class="tip">💡 50 агентств × 5 клиентов = 250 потенциальных заказов/мес. Самый масштабируемый канал.</div>`,

t23:`<h5>📊 Концепция</h5>
<div class="step"><div class="step-num">1</div><div class="step-text">Бесплатный инструмент: ввести название бренда / Instagram</div></div>
<div class="step"><div class="step-num">2</div><div class="step-text">Показать: «Ваш бренд видят только 12% жителей Алматы»</div></div>
<div class="step"><div class="step-num">3</div><div class="step-text">Сравнение с конкурентами: «А вот [конкурент] охватывает 45%»</div></div>
<div class="step"><div class="step-num">4</div><div class="step-text">CTA: «Увеличить охват до 80% → подобрать паблики»</div></div>
<div class="tip">💡 Создаёт FOMO. Клиент видит проблему, которую раньше не осознавал → мотивация к покупке.</div>`,

t24:`<h5>🤖 Архитектура бота</h5>
<div class="step"><div class="step-num">1</div><div class="step-text">Старт: «В каком городе нужна реклама?» → кнопки с городами</div></div>
<div class="step"><div class="step-num">2</div><div class="step-text">«Какая ниша?» → рестораны, клиники, авто и т.д.</div></div>
<div class="step"><div class="step-num">3</div><div class="step-text">«Бюджет?» → 300К / 500К / 1М / Свой</div></div>
<div class="step"><div class="step-num">4</div><div class="step-text">Мгновенная подборка из базы → PDF</div></div>
<div class="step"><div class="step-num">5</div><div class="step-text">«Оплатить» → Kaspi Pay ссылка</div></div>
<div class="tip">💡 Казахстан = Telegram-страна. Минимальный порог входа для МСБ. Может дать 20-30% конверсии на малых чеках.</div>`,

t25:`<h5>📣 Как внедрить</h5>
<div class="step"><div class="step-num">1</div><div class="step-text">Добавить фрейм на сайт, во все КП, во все презентации</div></div>
<div class="step"><div class="step-num">2</div><div class="step-text">Использовать в каждом выступлении и интервью</div></div>
<div class="step"><div class="step-num">3</div><div class="step-text">SDR в каждом звонке: «Вы используете таргет и контекст? А третий обязательный канал?»</div></div>
<p>Формула: <b>Таргет</b> (точечно) + <b>Контекст</b> (горячий спрос) + <b>Городские паблики</b> (массовый охват) = полный охват.</p>
<div class="tip">💡 Категорийный маркетинг из «Play Bigger». Повторяй пока это не станет «общеизвестным фактом».</div>`,

t26:`<h5>📄 Структура отчёта</h5>
<div class="step"><div class="step-num">1</div><div class="step-text">Автоматическая генерация PDF через 7 дней после размещения</div></div>
<div class="step"><div class="step-num">2</div><div class="step-text">Метрики: охват, просмотры, вовлечённость, клики (если UTM)</div></div>
<div class="step"><div class="step-num">3</div><div class="step-text">Сравнение с бенчмарками: «Ваш охват на 30% выше среднего по нише»</div></div>
<div class="step"><div class="step-num">4</div><div class="step-text">Рекомендация: «Для закрепления эффекта — повторная волна через 2 недели»</div></div>
<div class="tip">💡 Отчёт = апсейл на повторное размещение. Клиент видит результат → хочет ещё.</div>`,

t27:`<h5>⭐ Как реализовать</h5>
<div class="step"><div class="step-num">1</div><div class="step-text">После каждого размещения — клиент оценивает паблик (1-5 звёзд)</div></div>
<div class="step"><div class="step-num">2</div><div class="step-text">Показывать: средний охват, скорость публикации, качество контента</div></div>
<div class="step"><div class="step-num">3</div><div class="step-text">Бейджи: «Топ-10 Алматы», «Быстрая публикация», «Высокий охват»</div></div>
<div class="tip">💡 Как Booking для отелей. Клиент доверяет рейтингам → проще принять решение.</div>`,

t28:`<h5>🎤 Как провести</h5>
<div class="step"><div class="step-num">1</div><div class="step-text">Формат: вебинар 60 мин, бесплатный, запись в YouTube</div></div>
<div class="step"><div class="step-num">2</div><div class="step-text">Тема: «Городские паблики в медиамиксе: кейсы, цифры, интеграция»</div></div>
<div class="step"><div class="step-num">3</div><div class="step-text">Пригласить 50 агентств через LinkedIn + Instagram + email</div></div>
<div class="step"><div class="step-num">4</div><div class="step-text">В конце: «Первым 10 агентствам — бесплатный пилот для вашего клиента»</div></div>
<div class="tip">💡 Образовательный маркетинг. Агентства начнут включать Pabliki в медиапланы своих клиентов.</div>`,

t29:`<h5>🚀 Шаги</h5>
<div class="step"><div class="step-num">1</div><div class="step-text">Связаться с Astana Hub / MOST Hub — предложить партнёрство</div></div>
<div class="step"><div class="step-num">2</div><div class="step-text">Формат: бесплатный пилот для 10 стартапов из инкубатора</div></div>
<div class="step"><div class="step-num">3</div><div class="step-text">Взамен: статус «Партнёр экосистемы» + доступ к мероприятиям</div></div>
<div class="tip">💡 Стартапы растут → бюджеты растут → долгосрочные клиенты. Плюс PR и нетворкинг.</div>`,

t30:`<h5>🎯 Как достичь</h5>
<p>Микс каналов к концу 4-го месяца:</p>
<ul>
<li><b>10-15</b> заказов — SDR (холодные продажи)</li>
<li><b>5-10</b> заказов — входящие с сайта (калькулятор, квиз)</li>
<li><b>3-5</b> заказов — первые агентства</li>
<li><b>2-5</b> заказов — повторные клиенты из «Первой сотни»</li>

// ===================== VICTORIA AI =====================
const VICTORIA_BOT = 'viktoriya_shtat_bot';
const VICTORIA_TASKS = {
  t1:'do',t2:'guide',t3:'guide',t4:'guide',t5:'do',t6:'do',t7:'guide',
  t8:'do',t9:'guide',t11:'do',t13:'guide',t14:'guide',t15:'do',
  t20:'do',t22:'do',t25:'do',t26:'do',t28:'do',
  t40:'do',t43:'do',t46:'do',t47:'do',t48:'do',t60:'do',t62:'do',
};
const VICTORIA_LABELS = {do:'🚀 Виктория, выполни',guide:'📋 Инструкция от Виктории'};

function victoriaAction(taskId, title, type) {
  const text = type === 'do'
    ? `Выполни задачу из Roadmap: "${title}" (ID: ${taskId}). Сделай полностью и покажи результат.`
    : `Дай подробную инструкцию по задаче из Roadmap: "${title}" (ID: ${taskId}). Что конкретно нужно сделать, пошагово.`;
  window.open(`https://t.me/${VICTORIA_BOT}?text=${encodeURIComponent(text)}`, '_blank');
}

// ===================== STATE =====================
let state = loadState();
let currentView = 'roadmap';
let currentFilter = 'all';
let expandedTasks = {};
let roadmapSearch = '';

function loadState(){
  try{
    const s = localStorage.getItem('pabliki_roadmap_v2');
    if(s) return JSON.parse(s);
  }catch(e){}
  return {phases: JSON.parse(JSON.stringify(DEFAULT_PHASES)), customTasks:[], version:2};
}

function saveState(){
  localStorage.setItem('pabliki_roadmap_v2', JSON.stringify(state));
}

// ===================== RENDER =====================
function render(){
  const app = document.getElementById('app');
  if(currentView === 'roadmap') renderRoadmap(app);
  else if(currentView === 'selection') renderSelection(app);
  else if(currentView === 'clients') renderClients(app);
  else if(currentView === 'finance') renderFinance(app);
  else renderSettings(app);
  updateNav();
}

function renderRoadmap(app){
  const allTasks = getAllTasks();
  let filtered = currentFilter === 'all' ? allTasks : allTasks.filter(t => t.tags && t.tags.some(tag => tag === 'type-'+currentFilter));
  if(roadmapSearch){
    const q = roadmapSearch.toLowerCase();
    filtered = filtered.filter(t => (t.title&&t.title.toLowerCase().includes(q)) || (t.desc&&t.desc.toLowerCase().includes(q)));
  }
  const done = filtered.filter(t=>t.done).length;
  const total = filtered.length;
  const pct = total ? Math.round(done/total*100) : 0;
  const pending = allTasks.filter(t=>!t.done).length;
  const completed = allTasks.filter(t=>t.done).length;

  let html = `
    <div class="header">
      <img src="logo-light.png" class="header-logo logo-light" alt="Pabliki" style="height:36px">
      <img src="logo-dark.png" class="header-logo logo-dark" alt="Pabliki" style="height:36px">
      <p>Roadmap → 100 заказов × 1 000 000₸</p>
    </div>
    <div class="progress-section">
      <div class="progress-header">
        <span>Общий прогресс</span>
        <strong>${pct}%</strong>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="stats">
      <div class="stat green"><div class="num">${completed}</div><div class="label">Выполнено</div></div>
      <div class="stat orange"><div class="num">${pending}</div><div class="label">Осталось</div></div>
      <div class="stat blue"><div class="num">${allTasks.length}</div><div class="label">Всего</div></div>
    </div>
    <input type="text" id="roadmapSearchInput" class="ig-search" placeholder="🔍 Поиск задач..." value="${roadmapSearch}" oninput="roadmapSearch=this.value;render()">
    <div class="tabs">
      <div class="tab ${currentFilter==='all'?'active':''}" onclick="setFilter('all')">Все</div>
      <div class="tab ${currentFilter==='seo'?'active':''}" onclick="setFilter('seo')">SEO</div>
      <div class="tab ${currentFilter==='sales'?'active':''}" onclick="setFilter('sales')">Продажи</div>
      <div class="tab ${currentFilter==='marketing'?'active':''}" onclick="setFilter('marketing')">Маркетинг</div>
      <div class="tab ${currentFilter==='product'?'active':''}" onclick="setFilter('product')">Продукт</div>
      <div class="tab ${currentFilter==='team'?'active':''}" onclick="setFilter('team')">Команда</div>
    </div>
  `;

  state.phases.forEach(phase => {
    let phaseTasks = currentFilter === 'all' ? phase.tasks : phase.tasks.filter(t => t.tags && t.tags.some(tag => tag === 'type-'+currentFilter));
    if(roadmapSearch){ const q=roadmapSearch.toLowerCase(); phaseTasks=phaseTasks.filter(t=>(t.title&&t.title.toLowerCase().includes(q))||(t.desc&&t.desc.toLowerCase().includes(q))); }
    if(phaseTasks.length === 0) return;
    const pd = phaseTasks.filter(t=>t.done).length;
    const pt = phaseTasks.length;
    const isOpen = phase._open !== false;
    html += `
      <div class="phase ${isOpen?'open':''}">
        <div class="phase-header" onclick="togglePhase('${phase.id}')">
          <div class="phase-icon" style="background:${phase.color};opacity:0.15;position:absolute;inset:0;border-radius:10px"></div>
          <div class="phase-icon" style="position:relative;color:${phase.color}">${phase.icon}</div>
          <div class="phase-info">
            <h3>${phase.name}</h3>
            <div class="meta">${phase.months} • ${pd}/${pt} задач</div>
          </div>
          <div class="phase-progress" style="color:${phase.color}">${Math.round(pd/pt*100)}%</div>
          <div class="phase-chevron">▼</div>
        </div>
        <div class="phase-body">
          ${phaseTasks.map(t => renderTask(t, phase.id)).join('')}
          <button class="add-task-btn" onclick="showAddForm('${phase.id}')">+ Добавить задачу</button>
          <div class="add-form" id="form-${phase.id}">
            <input type="text" id="input-title-${phase.id}" placeholder="Название задачи">
            <textarea id="input-desc-${phase.id}" placeholder="Описание (опционально)"></textarea>
            <div class="form-row">
              <select id="input-priority-${phase.id}">
                <option value="priority-high">🔴 Высокий</option>
                <option value="priority-med">🟡 Средний</option>
                <option value="priority-low">🔵 Низкий</option>
              </select>
              <select id="input-type-${phase.id}">
                <option value="type-sales">💰 Продажи</option>
                <option value="type-marketing">📣 Маркетинг</option>
                <option value="type-seo">🔍 SEO</option>
                <option value="type-product">⚡ Продукт</option>
                <option value="type-team">👥 Команда</option>
              </select>
            </div>
            <div class="form-row" style="margin-top:4px">
              <button class="btn btn-primary" onclick="addTask('${phase.id}')">Добавить</button>
              <button class="btn btn-ghost" onclick="hideAddForm('${phase.id}')">Отмена</button>
            </div>
          </div>
        </div>
      </div>
    `;
  });

  app.innerHTML = html;
}

function renderTask(t, phaseId){
  const tagsHtml = (t.tags||[]).map(tag => {
    const labels = {'priority-high':'Высокий','priority-med':'Средний','priority-low':'Низкий','type-seo':'SEO','type-sales':'Продажи','type-product':'Продукт','type-marketing':'Маркетинг','type-team':'Команда'};
    return `<span class="tag ${tag}">${labels[tag]||tag}</span>`;
  }).join('');
  const howto = HOWTO[t.id] || t.howto || '';
  const isExpanded = expandedTasks[t.id];
  const vType = VICTORIA_TASKS[t.id];
  const vBtn = vType && !t.done ? `<button class="victoria-btn ${vType === 'do' ? 'can-do' : 'guide'}" onclick="event.stopPropagation();victoriaAction('${t.id}',\`${t.title.replace(/`/g,"'")}\`,'${vType}')">${VICTORIA_LABELS[vType]}</button>` : '';
  return `
    <div class="task ${t.done?'done':''} ${isExpanded?'expanded':''}">
      <div class="task-check" onclick="toggleTask('${phaseId}','${t.id}')"></div>
      <div class="task-content" onclick="toggleExpand('${t.id}')">
        <div class="task-title">${t.title}</div>
        ${t.desc ? `<div class="task-desc">${t.desc}</div>` : ''}
        <div class="task-tags">${tagsHtml}</div>
        ${howto ? `<button class="task-expand-btn" onclick="event.stopPropagation();toggleExpand('${t.id}')"><span class="chevron">▼</span> ${isExpanded ? 'Свернуть' : 'Как реализовать'}</button>` : ''}
        ${!isExpanded ? vBtn : ''}
        ${howto ? `<div class="task-howto">${howto}</div>` : ''}
        ${isExpanded ? vBtn : ''}
      </div>
      <div class="task-delete" onclick="deleteTask('${phaseId}','${t.id}')">✕</div>
    </div>
  `;
}

  // Calculate costs from TASK_COSTS + custom tasks

  const costsByPhase = {'p1':[], 'p2':[], 'p3':[], 'p4':[]};
  const costsByCat = {};
  
  // Known tasks
  for(const [id, c] of Object.entries(TASK_COSTS)){
    if(c.cost > 0){
      if(c.type === 'once') totalOnce += c.cost;
      else totalMonthly += c.cost;
      
      const phase = id.startsWith('t6') ? 'p4' : id.startsWith('t4') ? 'p3' : id.startsWith('t2') || id.startsWith('t3') ? 'p2' : 'p1';
      if(!costsByPhase[phase]) costsByPhase[phase] = [];
      costsByPhase[phase].push(c);
      
      if(!costsByCat[c.cat]) costsByCat[c.cat] = 0;
      costsByCat[c.cat] += c.type === 'monthly' ? c.cost * 12 : c.cost;
    }

  // Custom tasks (user-added) — count if they have cost in title like "(500K)"

// ===================== ACTIONS =====================
function getAllTasks(){
  let all = [];
  state.phases.forEach(p => all.push(...p.tasks));
  return all;
}

function togglePhase(id){
  const phase = state.phases.find(p=>p.id===id);
  if(phase) phase._open = phase._open === false ? true : false;
  saveState(); render();
}

function toggleExpand(taskId){
  expandedTasks[taskId] = !expandedTasks[taskId];
  render();
}

function toggleTask(phaseId, taskId){
  const phase = state.phases.find(p=>p.id===phaseId);
  if(!phase) return;
  const task = phase.tasks.find(t=>t.id===taskId);
  if(!task) return;
  task.done = !task.done;
  saveState(); render();
  if(task.done) showToast('✅ Выполнено!');
}

function deleteTask(phaseId, taskId){
  if(!confirm('Удалить задачу?')) return;
  const phase = state.phases.find(p=>p.id===phaseId);
  if(!phase) return;
  phase.tasks = phase.tasks.filter(t=>t.id!==taskId);
  saveState(); render();
  showToast('🗑 Удалено');
}

function showAddForm(phaseId){
  document.getElementById('form-'+phaseId).classList.add('show');
}
function hideAddForm(phaseId){
  document.getElementById('form-'+phaseId).classList.remove('show');
}

function addTask(phaseId){
  const title = document.getElementById('input-title-'+phaseId).value.trim();
  if(!title){showToast('Введите название');return;}
  const desc = document.getElementById('input-desc-'+phaseId).value.trim();
  const priority = document.getElementById('input-priority-'+phaseId).value;
  const type = document.getElementById('input-type-'+phaseId).value;
  const phase = state.phases.find(p=>p.id===phaseId);
  if(!phase) return;
  phase.tasks.push({id:'c'+Date.now(),title,desc,tags:[priority,type],done:false});
  saveState(); render();
  showToast('✅ Задача добавлена');
}

function setFilter(f){ currentFilter = f; render(); }
function switchView(view){ currentView = view; render(); window.scrollTo(0,0); }
function updateNav(){
  document.querySelectorAll('.nav-item').forEach((el,i) => {
    const views = ['roadmap','selection','clients','finance','settings'];
    el.classList.toggle('active', views[i]===currentView);
  });
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

function closeModal(e){
  if(e.target.id==='modalOverlay') document.getElementById('modalOverlay').classList.remove('show');
}

function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `pabliki-roadmap-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  showToast('📥 Экспорт сохранён');
}

function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      state = JSON.parse(ev.target.result);
      saveState(); render();
      showToast('📤 Импорт выполнен');
    }catch(err){
      showToast('❌ Ошибка файла');
    }
  };
  reader.readAsText(file);
}

function reloadLeadsOnly(){
  if(!confirm('Перезагрузить базу лидов? Ваши добавленные вручную лиды будут потеряны, но roadmap и подборки сохранятся.')) return;
  localStorage.removeItem('pabliki_leads');
  localStorage.removeItem('pabliki_leads_loaded');
  // Reload default leads
  if(typeof DEFAULT_LEADS !== 'undefined' && DEFAULT_LEADS.length){
    const leads = DEFAULT_LEADS.map((l,i) => ({
      id: 'dl_' + i + '_' + Date.now(),
      name: l.name || '', city: l.city || '', niche: l.niche || 'Другое',
      phone: l.phone || '', whatsapp: l.whatsapp || l.phone || '',
      instagram: l.instagram || '', igFollowers: l.igFollowers || 0,
      website: l.website || '', rating: l.rating || 0,
      notes: l.contact ? (l.role ? l.role + ': ' : '') + l.contact : '',
      status: 'new', score: 0,
      created: new Date().toISOString(), lastContact: null
    }));
    saveLeads(leads);
    localStorage.setItem('pabliki_leads_loaded', '1');

function scoreLead(lead){
  let score=0;
  if(lead.instagram) score+=20;
  if(lead.igFollowers && lead.igFollowers<10000) score+=15;
  if(lead.rating && lead.rating>=4.0) score+=10;
  if(['HoReCa','Бьюти','Клиники','Застройщики'].includes(lead.niche)) score+=15;
  if(['Алматы','Астана'].includes(lead.city)) score+=10;
  if(lead.whatsapp) score+=15;
  if(lead.phone) score+=10;
  return Math.min(score,100);
}

function parseCSV(){
  const fileInput=document.getElementById('csvFileInput');
  if(!fileInput.files.length){showToast('Выберите файл');return;}
  const file = fileInput.files[0];
  const isExcel = file.name.match(/\.xlsx?$/i);
  
  if(isExcel && typeof XLSX !== 'undefined'){
    // Excel import via SheetJS
    const reader = new FileReader();
    reader.onload = function(ev){
      try {
        const wb = XLSX.read(ev.target.result, {type:'array'});
        let allRows = [];
        // Process all sheets
        wb.SheetNames.forEach(sn => {
          const ws = wb.Sheets[sn];
          const data = XLSX.utils.sheet_to_json(ws, {defval:''});
          // Add sheet name as potential niche
          data.forEach(r => { r._sheet = sn; });
          allRows = allRows.concat(data);
        });
        if(!allRows.length){showToast('Файл пуст');return;}
        processImportRows(allRows);
      } catch(e){
        showToast('❌ Ошибка чтения Excel: '+e.message);
      }
    };
    reader.readAsArrayBuffer(file);
  } else {
    // CSV/TXT import
    const reader=new FileReader();
    reader.onload=function(ev){
      const lines=ev.target.result.split(/\r?\n/).filter(l=>l.trim());
      if(lines.length<2){showToast('Файл пуст');return;}
      const headerLine=lines[0].toLowerCase();
      const sep=headerLine.includes('\t')?'\t':headerLine.includes(';')?';':',';
      const headers=headerLine.split(sep).map(h=>h.trim());
      const rows = [];
      for(let i=1;i<lines.length;i++){
        const cols=lines[i].split(sep).map(c=>c.trim().replace(/^["']|["']$/g,''));
        const obj = {};
        headers.forEach((h,j) => obj[h] = cols[j] || '');
        rows.push(obj);
      }
      processImportRows(rows);
    };
    reader.readAsText(file);
  }
}

function processImportRows(rows){
  // Smart column detection
  const colAliases = {
    name: ['компания','название','name','company','наименование','организация'],
    city: ['город','city','регион'],
    niche: ['ниша','niche','категория','тип','сфера','_sheet'],
    phone: ['телефон','phone','тел','телефоны','моб'],
    contact: ['имя','контакт','contact','лпр','name','фио'],
    role: ['роль','role','должность'],
    instagram: ['instagram','инстаграм','ig','insta'],
    whatsapp: ['whatsapp','ватсап','wa']
  };
  
  function findCol(row, aliases){
    const keys = Object.keys(row);
    for(const alias of aliases){
      const found = keys.find(k => k.toLowerCase().includes(alias));
      if(found && row[found]) return String(row[found]).trim();
    }
    return '';
  }
  
  // Niche mapping
  const nicheMap = {
    'рестораны':'HoReCa','кафе':'HoReCa','банкет':'HoReCa','horeca':'HoReCa',
    'салон':'Бьюти','красот':'Бьюти','барбер':'Бьюти','beauty':'Бьюти',
    'медицин':'Клиники','стомат':'Клиники','клиник':'Клиники','аптек':'Клиники',
    'авто':'Автобизнес','мойк':'Автобизнес','сервис':'Автобизнес',
    'фитнес':'Фитнес','спорт':'Фитнес','gym':'Фитнес',
    'образ':'Образование','школ':'Образование','курс':'Образование',
    'строит':'Застройщики','недвижим':'Застройщики',
    'детск':'Детские центры','турист':'Туризм','туризм':'Туризм',
    'e-com':'E-commerce','магазин':'E-commerce'
  };
  
  function mapNiche(raw){
    if(!raw) return 'Другое';
    const lower = raw.toLowerCase();
    for(const [key,val] of Object.entries(nicheMap)){
      if(lower.includes(key)) return val;
    }
    return raw.length > 20 ? 'Другое' : raw;
  }
  
  const newLeads = [];
  const existing = new Set(getLeads().map(l => (l.name+'|'+l.city).toLowerCase()));
  
  rows.forEach((row, i) => {
    const name = findCol(row, colAliases.name);
    const city = findCol(row, colAliases.city) || 'Алматы';
    if(!name) return;
    
    const key = (name+'|'+city).toLowerCase();
    if(existing.has(key)) return; // skip dupes
    existing.add(key);
    
    let phone = findCol(row, colAliases.phone).replace(/[^\d+]/g,'');
    if(phone.startsWith('+')) phone = phone.slice(1);
    if(phone.startsWith('8') && phone.length===11) phone = '7' + phone.slice(1);
    
    const nicheRaw = findCol(row, colAliases.niche);
    const contact = findCol(row, colAliases.contact);
    const role = findCol(row, colAliases.role);
    
    newLeads.push({
      id: 'imp_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)+'_'+i,
      name, city,
      niche: mapNiche(nicheRaw),
      phone, whatsapp: phone,
      instagram: findCol(row, colAliases.instagram).replace('@',''),
      igFollowers: 0, website: '', rating: 0,
      notes: (role && contact) ? role+': '+contact : contact || '',
      status: 'new', score: 0,
      created: new Date().toISOString(), lastContact: null
    });
  });
  
  if(!newLeads.length){showToast('Новых лидов не найдено (возможно дубли)');return;}
  if(!confirm('Найдено '+newLeads.length+' новых лидов. Импортировать?')) return;
  const leads = getLeads().concat(newLeads);
  saveLeads(leads);
  document.getElementById('modalOverlay').classList.remove('show');
  render(); showToast('✅ Импортировано: '+newLeads.length);
}

function renderLeadsContent(app, prefix){
  const leads=getLeads().map(l=>{l.score=scoreLead(l);return l;});
  const counts={all:leads.length,new:0,sent:0,dialog:0,client:0,rejected:0};
  leads.forEach(l=>counts[l.status]=(counts[l.status]||0)+1);

  // Filter
  let filtered=leads;
  if(leadStatusFilter!=='all') filtered=filtered.filter(l=>l.status===leadStatusFilter);
  if(leadNicheFilter!=='all') filtered=filtered.filter(l=>l.niche===leadNicheFilter);
  if(leadSearch){
    const q=leadSearch.toLowerCase();
    filtered=filtered.filter(l=>(l.name+' '+l.city+' '+l.niche).toLowerCase().includes(q));
  }
  // Sort
  if(leadSort==='score') filtered.sort((a,b)=>b.score-a.score);
  else if(leadSort==='date') filtered.sort((a,b)=>new Date(b.created)-new Date(a.created));
  else if(leadSort==='city') filtered.sort((a,b)=>a.city.localeCompare(b.city));
  else if(leadSort==='niche') filtered.sort((a,b)=>a.niche.localeCompare(b.niche));

  const fmt=n=>n?n.toLocaleString('ru-RU'):'0';
  const statusChips = [

function getParsCRM(){
  try{ return JSON.parse(localStorage.getItem('pabliki_parsing_crm'))||{}; }catch(e){ return {}; }
}
function saveParsCRM(crm){ localStorage.setItem('pabliki_parsing_crm', JSON.stringify(crm)); }

function getParsStatus(lead){
  const crm = getParsCRM();
  const key = lead.p || lead.n;
  return crm[key]?.status || 'new';
}

function setParsStatus(lead, status){
  const crm = getParsCRM();
  const key = lead.p || lead.n;
  if(!crm[key]) crm[key] = {status:'new', touches:[]};
  crm[key].status = status;
  saveParsCRM(crm);
  render();
}

function openLeadCRM(idx){
  const leads = typeof LEADS_2GIS!=='undefined'?LEADS_2GIS:[];
  const lead = leads[idx]; if(!lead) return;
  const crm = getParsCRM();
  const key = lead.p || lead.n;
  const data = crm[key] || {status:'new', touches:[]};
  const st = PARS_STATUSES;
  const waNum = (lead.w||lead.p||'').replace(/[^0-9]/g,'');
  const touchCount = data.touches.length;
  // Determine current step in funnel (0-indexed)
  const currentStep = Math.min(touchCount, 6);

  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');

  // Build funnel steps
  const funnelSteps = PARS_WA_TEMPLATES.map((t,i)=>{
    const msg = t.text.replace(/{name}/g, lead.n).replace(/{city}/g, lead.c).replace(/{niche}/g, lead.ni);
    const isDone = i < currentStep;
    const isCurrent = i === currentStep;
    const stepStyle = isDone ? 'opacity:0.5;' : isCurrent ? 'border-color:var(--primary);background:var(--surface);' : 'opacity:0.7;';
    const checkmark = isDone ? '✅' : isCurrent ? '👉' : '⬜';

    let actionBtn = '';
    if(waNum && (isCurrent || isDone)){
      const waUrl = 'https://wa.me/' + waNum + '?text=' + encodeURIComponent(msg);
      actionBtn = '<a href="'+waUrl+'" target="_blank" onclick="event.stopPropagation();addTouch(\''+key.replace(/'/g,"\\'")+'\',\''+t.name.replace(/'/g,"\\'")+'\')" style="display:inline-block;margin-top:6px;padding:6px 12px;border-radius:var(--radius);background:var(--green);color:#fff;font-size:11px;font-weight:700;text-decoration:none">💬 Отправить в WhatsApp</a>';
    }

    // Special: Touch 2 = Подборка — add button to create selection
    let selectionBtn = '';
    if(i === 1){
      selectionBtn = '<button onclick="goToSelectionForLead(\''+lead.c.replace(/'/g,"\\'")+'\',\''+lead.ni.replace(/'/g,"\\'")+'\')" style="display:inline-block;margin-top:6px;margin-left:6px;padding:6px 12px;border-radius:var(--radius);background:var(--primary);color:var(--primary-fg);font-size:11px;font-weight:700;border:none;cursor:pointer">📋 Создать подборку</button>';
    }

    return '<div style="padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;'+stepStyle+'">' +
      '<div style="display:flex;align-items:center;gap:8px"><span style="font-size:14px">'+checkmark+'</span><b style="font-size:12px;color:var(--text)">'+t.name+'</b></div>' +
      (isCurrent ? '<div style="font-size:11px;color:var(--text2);margin-top:6px;line-height:1.5">'+msg.replace(/\n/g,'<br>').substring(0,150)+'...</div>' : '') +
      '<div style="display:flex;flex-wrap:wrap;gap:4px">'+actionBtn+selectionBtn+'</div>' +
    '</div>';
  }).join('');

  content.innerHTML = `
    <h3 style="margin-bottom:4px;font-size:16px">${lead.n}</h3>
    <div style="font-size:13px;color:var(--text2);margin-bottom:12px">📍 ${lead.c} · ${lead.ni}</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">
      ${lead.p?`<a href="tel:${lead.p}" style="color:var(--primary);font-size:13px">📞 ${lead.p}</a>`:''}
      ${lead.w?`<a href="https://wa.me/${waNum}" target="_blank" style="color:var(--green);font-size:13px">💬 WhatsApp</a>`:''}
      ${lead.ig?`<a href="https://instagram.com/${lead.ig.replace('@','')}" target="_blank" style="color:var(--peach);font-size:13px">📸 ${lead.ig}</a>`:''}
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">
      ${st.map(s=>`<span class="filter-chip${data.status===s.id?' active':''}" onclick="setParsStatusModal('${key.replace(/'/g,"\\'")}','${s.id}')" style="font-size:11px;padding:4px 8px">${s.icon} ${s.label}</span>`).join('')}
    </div>

    <div style="margin-bottom:8px"><b style="font-size:13px">🎯 Воронка касаний</b> <span style="font-size:11px;color:var(--text3)">(${touchCount} из 7)</span></div>
    <div style="margin-bottom:12px">${funnelSteps}</div>

    <div style="margin-bottom:8px"><b style="font-size:13px">📝 История</b></div>
    <div id="crmTouches" style="max-height:150px;overflow-y:auto;margin-bottom:8px">

    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input id="crmNote" placeholder="Заметка..." style="flex:1;padding:8px;border-radius:var(--radius);border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:12px">

  `;

function goToSelectionForLead(city, niche){
  document.getElementById('modalOverlay').classList.remove('show');

  const nicheToCategory = {'Рестораны':'Еда/Досуг','Красота':'Городские','Медицина':'Городские','Авто':'Авто/Недвижимость','Образование':'Городские','Фитнес':'Городские','Недвижимость':'Авто/Недвижимость','Магазины':'Реклама/Торговля','Услуги':'Городские','IT':'Городские','Доставка':'Еда/Досуг','Развлечения':'Еда/Досуг','Отели':'Городские','Финансы':'Городские','Строительство':'Авто/Недвижимость'};
  // Reset filters
  selCities.clear();
  selCats.clear();
  // Find matching city in PABLIKI_CITIES
  if(typeof PABLIKI_CITIES!=='undefined'){
    const match = PABLIKI_CITIES.find(c=>c.toLowerCase()===city.toLowerCase()) || 
                  [...new Set(PABLIKI_DB.map(p=>p.c))].find(c=>c.toLowerCase()===city.toLowerCase());
    if(match) selCities.add(match);
  }
  // Map niche to category

  currentView = 'selection';
  render();

  showToast('📋 Подборка для '+city+(cat?' · '+cat:''));
}

function setParsStatusModal(key, status){
  const crm = getParsCRM();
  if(!crm[key]) crm[key]={status:'new',touches:[]};
  crm[key].status = status;
  saveParsCRM(crm);
  // re-render modal status chips
  const st = PARS_STATUSES;
  document.querySelectorAll('#modalContent .filter-chip').forEach((el,i)=>{
    if(i<st.length) el.classList.toggle('active', st[i].id===status);
  });
}

function addTouch(key, autoNote){
  const note = autoNote || document.getElementById('crmNote')?.value;
  if(!note) return;
  const crm = getParsCRM();
  if(!crm[key]) crm[key]={status:'new',touches:[]};
  crm[key].touches.push({date:new Date().toLocaleString('ru-RU'), note});
  saveParsCRM(crm);
  document.getElementById('crmNote').value='';
  // refresh touches list
  const container = document.getElementById('crmTouches');
  if(container) container.innerHTML = crm[key].touches.map(t=>`<div style="font-size:12px;color:var(--text2);padding:4px 0;border-bottom:1px solid var(--border)">${t.date} — ${t.note}</div>`).join('');
}

let _leads2gisLoading = false;

  if(typeof LEADS_2GIS !== 'undefined' && LEADS_2GIS && LEADS_2GIS.length){ callback(); return; }
  if(!_leads2gisLoading){
    _leads2gisLoading = true;
    app.innerHTML += '<div style="text-align:center;padding:40px"><div style="font-size:32px;animation:spin 1s linear infinite;display:inline-block">🔄</div><p style="margin-top:12px;color:var(--text2)">Загрузка базы 2GIS...</p></div>';
    const s = document.createElement('script');

function getParsStats(){
  const leads = typeof LEADS_2GIS!=='undefined'?LEADS_2GIS:[];
  const crm = getParsCRM();
  const cityCount = {}, nicheCount = {};
  const statusCount = {all:leads.length, new:0, sent:0, dialog:0, client:0, refused:0};
  leads.forEach(l=>{
    cityCount[l.c]=(cityCount[l.c]||0)+1;
    nicheCount[l.ni]=(nicheCount[l.ni]||0)+1;
    const key = l.p||l.n;
    const s = crm[key]?.status||'new';
    statusCount[s]=(statusCount[s]||0)+1;
  });
  return {leads, crm, cityCount, nicheCount, statusCount,
    topCities: Object.entries(cityCount).sort((a,b)=>b[1]-a[1]),
    topNiches: Object.entries(nicheCount).sort((a,b)=>b[1]-a[1])};
}

// ---- Mailing state ----
let _mailText = '';
let _mailMedia = null; // {name, size, blobUrl, type}
let _mailSource = 'leads'; // leads | 2gis
let _mailNicheFilter = new Set();
let _mailCityFilter = new Set();
let _mailStatusFilter = new Set();
let _mailSelected = new Set();
let _mailShowAll = false;
let _mailSending = false;
let _mailSendIdx = 0;
let _mailSendList = [];

function _mailGetRecipients(){
  let list = [];
  if(_mailSource === 'leads'){
    list = getLeads().map(l=>({key:l.id, name:l.name, city:l.city, niche:l.niche, phone:l.whatsapp||l.phone, status: l.status||'new'}));
  } else {
    if(typeof LEADS_2GIS==='undefined'||!LEADS_2GIS) return [];
    const crm = getParsCRM();
    list = LEADS_2GIS.map(l=>{const k=l.p||l.n; return {key:k, name:l.n, city:l.c, niche:l.ni, phone:l.w||l.p||'', status: crm[k]?.status||'new'};});
  }
  if(_mailNicheFilter.size) list = list.filter(r=>_mailNicheFilter.has(r.niche));
  if(_mailCityFilter.size) list = list.filter(r=>_mailCityFilter.has(r.city));
  if(_mailStatusFilter.size) list = list.filter(r=>_mailStatusFilter.has(r.status));
  return list;
}

function _mailToggleAll(){
  const recs = _mailGetRecipients();
  if(_mailSelected.size === recs.length){ _mailSelected.clear(); } else { recs.forEach(r=>_mailSelected.add(r.key)); }
  render();
}

function _mailToggle(key){ if(_mailSelected.has(key)) _mailSelected.delete(key); else _mailSelected.add(key); render(); }

function _mailStartSend(){
  const recs = _mailGetRecipients().filter(r=>_mailSelected.has(r.key) && r.phone);
  if(!recs.length){showToast('Нет получателей с номером');return;}
  _mailSendList = recs;
  _mailSendIdx = 0;
  _mailSending = true;
  render();
}

function _mailMarkSent(){
  const r = _mailSendList[_mailSendIdx];
  if(!r) return;
  if(_mailSource === '2gis'){
    const crm = getParsCRM();
    if(!crm[r.key]) crm[r.key]={status:'new',touches:[]};
    crm[r.key].status = 'sent';
    crm[r.key].touches.push({date:new Date().toISOString().slice(0,10), note:'Рассылка'});
    saveParsCRM(crm);
  } else {
    const leads = getLeads();
    const l = leads.find(x=>x.id===r.key);
    if(l){ l.status='sent'; l.lastContact=new Date().toISOString(); }
    saveLeads(leads);
  }
  showToast('✅ Отмечено');
}

function _mailNext(){
  _mailSendIdx++;
  if(_mailSendIdx >= _mailSendList.length){ _mailSending=false; showToast('🎉 Рассылка завершена!'); }
  render();
}

function _mailAttach(type){
  const inp = document.createElement('input');
  inp.type='file';
  if(type==='photo') inp.accept='image/*';
  else if(type==='video') inp.accept='video/*';
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    _mailMedia={name:f.name, size:(f.size/1024).toFixed(1)+'KB', blobUrl:URL.createObjectURL(f), type:f.type};
    render();
  };
  inp.click();
}

function _highlightPlaceholders(text){
  return text.replace(/\{(name|city|niche)\}/g,'<span style="background:oklch(from var(--primary) l c h / 0.2);color:var(--primary);padding:1px 4px;border-radius:3px;font-weight:700">{$1}</span>');
}

function renderCRMTab(app, prefix){

    app.innerHTML = (prefix||'');
    ensureLeads2GIS(app, ()=>render());

  const {leads, crm, statusCount} = getParsStats();

  const withTouches = allEntries.filter(([k,v])=>v.touches?.length).sort((a,b)=>{

  const contacted = statusCount.sent + statusCount.dialog + statusCount.client + statusCount.refused;

  app.innerHTML = (prefix||'') + `

          {label:'В диалоге / клиенты', value:inDialog, color:'#8b5cf6', pct:contacted?Math.round(inDialog/contacted*100):0},
          {label:'Стали клиентами', value:clients, color:'var(--green)', pct:convRate}
        ].map(f=>'<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>'+f.label+'</span><span style="font-weight:700;color:'+f.color+'">'+f.value.toLocaleString('ru-RU')+' ('+f.pct+'%)</span></div><div style="height:8px;background:var(--surface);border-radius:4px;overflow:hidden"><div style="height:100%;width:'+f.pct+'%;background:'+f.color+';border-radius:4px;transition:width .5s"></div></div></div>').join('')}
      </div>
    </div>
    <div class="finance-card">
      <h4>📊 По статусам</h4>
      ${PARS_STATUSES.map(s=>'<div class="finance-row"><span class="label">'+s.icon+' '+s.label+'</span><span class="value">'+(byStatus[s.id]||0).toLocaleString('ru-RU')+'</span></div>').join('')}
    </div>
    <div class="finance-card">
      <h4>🕐 Последние касания</h4>
      ${withTouches.length ? withTouches.map(([key,data])=>{
        const lastTouch = data.touches[data.touches.length-1];
        const st = PARS_STATUSES.find(s=>s.id===data.status);
        return '<div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:13px"><div style="display:flex;justify-content:space-between;align-items:center"><b style="color:var(--text)">'+key+'</b><span style="font-size:11px">'+(st?.icon||'')+' '+(st?.label||'')+'</span></div><div style="font-size:11px;color:var(--text3);margin-top:2px">'+(lastTouch?.date||'')+' — '+(lastTouch?.note||'')+'</div><div style="font-size:10px;color:var(--text3)">Всего касаний: '+data.touches.length+'</div></div>';
      }).join('') : '<div style="color:var(--text3);font-size:13px;padding:12px 0">Пока нет касаний. Начните рассылку!</div>'}
    </div>
  `;
}

// Restore from localStorage
(function restoreSelection(){
  try {
    const saved = JSON.parse(localStorage.getItem('pabliki_selection'));
    if (!saved) return;
    if (saved.selCities) selCities = new Set(saved.selCities);
    if (saved.selCats) selCats = new Set(saved.selCats);
    if (saved.selMode) selMode = saved.selMode;
    if (saved.selMinSubs != null) selMinSubs = saved.selMinSubs;
    if (saved.selMaxPerItem != null) selMaxPerItem = saved.selMaxPerItem;
    if (saved.selBudget != null) selBudget = saved.selBudget;
    if (saved.selSelected) selSelected = new Set(saved.selSelected);
  } catch(e){}
})();

function saveSelection(){
  localStorage.setItem('pabliki_selection', JSON.stringify({
    selCities: [...selCities],
    selCats: [...selCats],
    selMode,
    selMinSubs,
    selMaxPerItem,
    selBudget,
    selSelected: [...selSelected]
  }));
  showToast('💾 Подборка сохранена');
}

function sortPabliki(list) {
  const col = selSort.col;
  const dir = selSort.dir === 'asc' ? 1 : -1;
  return list.sort((a,b) => {
    let va = a[col], vb = b[col];
    if (typeof va === 'string') return va.localeCompare(vb,'ru') * dir;
    return (va - vb) * dir;
  });
}

function toggleSort(col) {
  if (selSort.col === col) selSort.dir = selSort.dir === 'asc' ? 'desc' : 'asc';
  else { selSort.col = col; selSort.dir = col === 'ig' || col === 'c' || col === 't' ? 'asc' : 'desc'; }
  render();
}

function sortArrow(col) {
  if (selSort.col !== col) return '';
  return `<span class="sort-arrow active">${selSort.dir === 'asc' ? '▲' : '▼'}</span>`;
}

function getFilteredPabliki(){
  let list = PABLIKI_DB.filter(p => {
    if(selCities.size > 0 && !selCities.has(p.c)) return false;
    if(selCats.size > 0 && !selCats.has(p.t)) return false;
    if(p.s < selMinSubs) return false;
    if(p.p > selMaxPerItem) return false;
    if(igSearch && !p.ig.toLowerCase().includes(igSearch.toLowerCase())) return false;
    if(selShowOnly && !selSelected.has(p.ig)) return false;
    return true;
  });
  return sortPabliki(list);
}

function getCustomPabliki(){
  try { return JSON.parse(localStorage.getItem('pabliki_custom') || '[]'); } catch(e){ return []; }
}
function saveCustomPabliki(list){
  localStorage.setItem('pabliki_custom', JSON.stringify(list));
}
function loadCustomPabliki(){
  const custom = getCustomPabliki();
  // Remove previously added customs from PABLIKI_DB to avoid dupes on reload
  custom.forEach(cp => {
    if(!PABLIKI_DB.find(p => p.ig === cp.ig)){
      PABLIKI_DB.push(cp);
    }
  });
  // Update cities & cats
  const newCities = [...new Set(PABLIKI_DB.map(p=>p.c))].filter(c => !PABLIKI_CITIES.includes(c));
  newCities.forEach(c => PABLIKI_CITIES.push(c));
  const newCats = [...new Set(PABLIKI_DB.map(p=>p.t))].filter(c => !PABLIKI_CATS.includes(c));
  newCats.forEach(c => PABLIKI_CATS.push(c));
}

  const cats = ['Новостные','Вакансии','Мамочки','Авто/Недвижимость','Еда/Досуг','Городские','Реклама/Торговля','Общие'];
  const catOpts = cats.map(c => `<option value="${c}">${c}</option>`).join('');
  document.getElementById('modalContent').innerHTML = `
    <h3 style="font-size:16px;font-weight:700;margin-bottom:16px;color:var(--text)">➕ Добавить паблик</h3>
    <div class="add-form show">
      <input id="ap_ig" placeholder="Instagram (без @)" style="text-transform:lowercase">

      <datalist id="cityList">${PABLIKI_CITIES.map(c=>`<option value="${c}">`).join('')}</datalist>
      <select id="ap_cat">${catOpts}</select>

      <input id="ap_link" placeholder="Ссылка Instagram (необязательно)">
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn btn-primary" onclick="addPablik()" style="flex:1">Добавить</button>
        <button class="btn btn-ghost" onclick="document.getElementById('modalOverlay').classList.remove('show')" style="flex:1">Отмена</button>
      </div>

  document.getElementById('modalOverlay').classList.add('show');

function addPablik(){
  const ig = document.getElementById('ap_ig').value.trim().replace('@','').toLowerCase();
  const city = document.getElementById('ap_city').value.trim();
  const cat = document.getElementById('ap_cat').value;
  const subs = parseInt(document.getElementById('ap_subs').value) || 0;
  const cost = parseInt(document.getElementById('ap_cost').value) || 0;
  const price = parseInt(document.getElementById('ap_price').value) || 0;
  const link = document.getElementById('ap_link').value.trim() || ('https://instagram.com/'+ig);
  
  if(!ig){showToast('Введите Instagram');return;}
  if(!city){showToast('Введите город');return;}
  if(subs <= 0){showToast('Введите подписчиков');return;}
  if(price <= 0){showToast('Введите цену');return;}
  
  if(PABLIKI_DB.find(p => p.ig === ig)){
    showToast('⚠️ Паблик @'+ig+' уже в базе');return;
  }
  
  const newP = {c:city, ig:ig, s:subs, co:cost, p:price, l:link, t:cat, custom:true};
  PABLIKI_DB.push(newP);
  
  // Save to localStorage
  const custom = getCustomPabliki();
  custom.push(newP);
  saveCustomPabliki(custom);
  
  // Update cities/cats if new
  if(!PABLIKI_CITIES.includes(city)) PABLIKI_CITIES.push(city);
  if(!PABLIKI_CATS.includes(cat)) PABLIKI_CATS.push(cat);
  
  document.getElementById('modalOverlay').classList.remove('show');
  showToast('✅ @'+ig+' добавлен!');
  render();
}

function deletePablik(ig){
  if(!confirm('Удалить @'+ig+' из базы?')) return;
  const idx = PABLIKI_DB.findIndex(p => p.ig === ig);
  if(idx >= 0) PABLIKI_DB.splice(idx, 1);
  selSelected.delete(ig);
  const custom = getCustomPabliki().filter(p => p.ig !== ig);
  saveCustomPabliki(custom);
  showToast('🗑 @'+ig+' удалён');
  render();
}

function autoSelectByBudget(){
  if(selBudget >= 10000000) return; // unlimited
  selSelected.clear();
  const filtered = getFilteredPabliki();
  let total = 0;
  for(const p of filtered){
    if(total + p.p <= selBudget){
      selSelected.add(p.ig);
      total += p.p;
    }
  }
}

function toggleSel(ig){
  if(selSelected.has(ig)) selSelected.delete(ig);
  else selSelected.add(ig);
  render();
}

function selectAllFiltered(){
  getFilteredPabliki().forEach(p => selSelected.add(p.ig));
  render();
}
